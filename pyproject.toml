[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "t04-scnr"
version = "0.4.2"
description = "Local-first model artifact forensics with evidence-grounded interpretation and explainable reports"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2,<3", "scipy>=1.14,<2", "scikit-learn>=1.6,<2",
  "safetensors>=0.5,<1", "pydantic>=2.9,<3", "streamlit>=1.40,<2",
  "reportlab>=4.4,<5", "plotly>=5.24,<7", "pandas>=2.2,<4", "psutil>=6,<8", "huggingface-hub>=0.27,<2"
]

[project.optional-dependencies]
security = ["modelaudit==0.2.54", "picklescan==1.0.5"]
demo = ["transformers>=4.46,<5", "Pillow>=11,<13"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pypdf>=5,<7"]

[project.scripts]
t04-scnr = "stegogate.cli:main"
stegogate = "stegogate.cli:main"

[project.urls]
Repository = "https://github.com/nakulmaurya/T04-Scnr"
Issues = "https://github.com/nakulmaurya/T04-Scnr/issues"

[tool.setuptools.packages.find]
include = ["stegogate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
